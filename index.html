<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Котик">
<title>Котик и Время</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0f0f1e;font-family:sans-serif;color:#fff;overflow:hidden;touch-action:none;user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #game{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1e1e3f,#0a0a15)}
  #cat{position:absolute;width:70px;height:70px;z-index:6;transition:transform .15s;filter:drop-shadow(0 0 10px #ffd16666);pointer-events:none}
  #cat svg{width:100%;height:100%;display:block}
  #cat img{width:100%;height:100%;object-fit:contain}
  .gate{position:absolute;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;transition:.3s;z-index:3}
  .gate.morning{background:radial-gradient(circle,#4da6ff,#1a5fa8);border:3px solid #7fc4ff;box-shadow:0 0 20px #4da6ff}
  .gate.evening{background:radial-gradient(circle,#ff9a3c,#a85000);border:3px solid #ffbb6b;box-shadow:0 0 20px #ff9a3c}
  .gate.closed{background:#2a2a3a;border:3px dashed #444;box-shadow:none;opacity:.55}
  .gate.done{background:#2ecc71;border:3px solid #27ae60;box-shadow:0 0 20px #2ecc71;opacity:.85}
  .gate.active{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  #bowl{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4;cursor:pointer;animation:bowlBounce 1.4s infinite;filter:drop-shadow(0 0 14px #ffb84d)}
  @keyframes bowlBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.06)}}
  #bowl.garmoshka{animation:bowlBounce 1s infinite, rainbow 3s infinite linear;filter:drop-shadow(0 0 24px #ff44ff) !important}
  @keyframes rainbow{0%{filter:drop-shadow(0 0 22px #ff44ff) hue-rotate(0deg)}100%{filter:drop-shadow(0 0 22px #ff44ff) hue-rotate(360deg)}}
  #hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px;z-index:10;background:linear-gradient(#000a,#0000)}
  #phase{position:absolute;top:50px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:bold;z-index:10}
  .phase-morning{background:#1a5fa8;color:#cce4ff}
  .phase-evening{background:#a85000;color:#ffe0b8}
  #chapterBox{position:absolute;top:90px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:14px;background:rgba(0,0,0,.55);border:1px solid #ffffff33;font-size:13px;z-index:10;text-align:center;line-height:1.35;max-width:90%}
  #msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(15,15,30,.97);padding:22px;border-radius:16px;text-align:center;display:none;z-index:40;max-width:85%;border:2px solid #e94560;box-shadow:0 0 30px #e9456066}
  #msg h3{margin:0 0 10px;font-size:20px}
  #msg p{margin:0 0 14px;font-size:14px;line-height:1.45;white-space:pre-line}
  #msg button{padding:10px 24px;border:none;border-radius:10px;background:#e94560;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
  .joystick{position:absolute;bottom:30px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);z-index:15}
  .stick{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.4);top:32px;left:32px;pointer-events:none}
  #timeLeft{font-size:11px;opacity:.7;margin-top:2px}
  #editorBtn,#skinBtn,#bowlBtn,#communityBtn,#achBtn{position:absolute;bottom:30px;width:52px;height:52px;border-radius:50%;border:none;color:#fff;font-size:20px;z-index:15;cursor:pointer}
  #editorBtn{right:20px;background:#e94560;box-shadow:0 0 20px #e94560aa}
  #skinBtn{right:80px;background:#9b59b6;box-shadow:0 0 20px #9b59b6aa}
  #bowlBtn{right:140px;background:#e67e22;box-shadow:0 0 20px #e67e22aa}
  #communityBtn{right:200px;background:#16a085;box-shadow:0 0 20px #16a085aa}
  #achBtn{right:260px;background:#f1c40f;color:#000;box-shadow:0 0 20px #f1c40faa;position:absolute}
  #achBtn .badge{position:absolute;top:-4px;right:-4px;background:#e74c3c;color:#fff;border-radius:10px;font-size:10px;padding:2px 6px;font-weight:bold;display:none}
  #bubble{position:absolute;padding:8px 12px;background:#fff;color:#111;border-radius:14px;font-size:13px;font-weight:bold;z-index:9;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .3s, top .3s, left .3s;box-shadow:0 4px 12px #0006}
  #bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff}
  #bubble.show{opacity:1}
  #toast{position:absolute;top:130px;left:50%;transform:translate(-50%,-20px);background:linear-gradient(135deg,#f1c40f,#e67e22);color:#000;padding:12px 20px;border-radius:14px;font-weight:bold;font-size:14px;z-index:50;opacity:0;transition:.4s;box-shadow:0 8px 24px #000a;text-align:center;pointer-events:none;max-width:80%}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast .ic{font-size:22px;display:block;margin-bottom:2px}
  .panel{position:absolute;inset:0;background:#0f0f1e;z-index:30;display:none;overflow-y:auto;padding:16px 16px 100px}
  .panel h2{margin:8px 0 12px;font-size:18px}
  .edlevel{background:#1a1a2e;border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid #ffffff1a}
  .edlevel input,.edlevel select{background:#0f0f1e;border:1px solid #333;color:#fff;padding:6px 8px;border-radius:8px;font-size:13px;width:100%}
  .edrow{display:flex;gap:8px;align-items:center;margin-top:6px}
  .edrow label{font-size:12px;opacity:.8;min-width:70px}
  .edbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .edbtns button{padding:8px 12px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:bold}
  .btn-green{background:#2ecc71;color:#000}
  .btn-blue{background:#3498db;color:#fff}
  .btn-red{background:#e74c3c;color:#fff}
  .btn-yellow{background:#f1c40f;color:#000}
  .btn-gray{background:#555;color:#fff}
  .btn-orange{background:#e67e22;color:#fff}
  .btn-teal{background:#16a085;color:#fff}
  .toolbar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background:#0a0a15;display:flex;gap:8px;z-index:31;flex-wrap:wrap}
  .toolbar button{flex:1;min-width:100px;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer}
  .gate-row{background:#111124;padding:10px;border-radius:10px;margin-top:8px}
  .mini{font-size:11px;opacity:.7;margin-top:4px}
  #skinPreview{width:180px;height:180px;margin:0 auto 12px;background:#111124;border-radius:16px;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff22}
  #skinPreview svg{width:140px;height:140px}
  #skinPreview img{width:140px;height:140px;object-fit:contain}
  .skinrow{display:flex;gap:10px;align-items:center;margin-top:10px;background:#1a1a2e;padding:10px;border-radius:10px}
  .skinrow label{font-size:13px;min-width:110px}
  .skinrow input[type=color]{width:56px;height:40px;border:none;background:none;border-radius:8px;cursor:pointer}
  .skinrow input[type=range]{flex:1}
  .skinval{min-width:36px;text-align:right;font-size:12px;opacity:.7}
  #skinUpload{width:100%;margin-top:10px;background:#0f0f1e;border:1px dashed #555;color:#aaa;padding:14px;border-radius:10px;font-size:13px;text-align:center}
  #bowlPreview{width:180px;height:180px;margin:0 auto 12px;background:#111124;border-radius:16px;display:flex;align-items:center;justify-content:center;border:1px solid #ffffff22;font-size:100px}
  .bowlSelect{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .bowlSelect button{width:56px;height:56px;border-radius:12px;border:2px solid #333;background:#1a1a2e;font-size:28px;cursor:pointer}
  .bowlSelect button.active{border-color:#e67e22;background:#3a2a10}
  #commInput{width:100%;background:#0f0f1e;border:1px solid #444;color:#fff;padding:14px;border-radius:12px;font-size:14px;font-family:monospace}
  #commPreview{background:#111124;border-radius:12px;padding:14px;margin-top:12px;font-size:13px;line-height:1.5;min-height:60px;border:1px solid #ffffff1a;white-space:pre-line}
  .commList{margin-top:12px}
  .commCard{background:#1a1a2e;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #ffffff1a;cursor:pointer}
  .commCard h4{margin:0 0 4px;font-size:14px;color:#ffd166}
  .commCard .meta{font-size:11px;opacity:.6}
  .commCard .code{font-size:10px;opacity:.5;font-family:monospace;word-break:break-all;margin-top:6px}
  .commCard .del{float:right;background:#e74c3c;border:none;color:#fff;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer}
  #achList .ach{background:#1a1a2e;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #ffffff1a;display:flex;gap:12px;align-items:center;opacity:.6}
  #achList .ach.unlocked{opacity:1;border-color:#f1c40f;background:linear-gradient(135deg,#1a1a2e,#3a2a10)}
  #achList .ach .ic{font-size:32px;min-width:44px;text-align:center}
  #achList .ach .info{flex:1}
  #achList .ach h4{margin:0 0 2px;font-size:14px}
  #achList .ach.unlocked h4{color:#f1c40f}
  #achList .ach p{margin:0;font-size:12px;opacity:.8;line-height:1.3}
  #achList .ach .done{color:#2ecc71;font-size:12px;font-weight:bold;margin-top:4px}
  #achProgress{background:#111124;border-radius:12px;padding:12px;margin-bottom:16px;border:1px solid #f1c40f55}
  #achProgress b{color:#f1c40f}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div>
      <div id="timeInfo">🕐 --:--</div>
      <div id="timeLeft"></div>
    </div>
    <div id="levelInfo">Уровень 1/2</div>
  </div>
  <div id="phase">—</div>
  <div id="chapterBox">—</div>
  <div id="bubble"></div>
  <div id="toast"></div>
  <div id="cat"></div>
  <div id="msg">
    <h3 id="msgTitle"></h3>
    <p id="msgText"></p>
    <button onclick="closeMsg()">ОК</button>
  </div>
  <div class="joystick" id="joy"><div class="stick" id="stick"></div></div>
  <button id="achBtn" onclick="openAch()">🏆<span class="badge" id="achBadge">0</span></button>
  <button id="communityBtn" onclick="openCommunity()">🌐</button>
  <button id="bowlBtn" onclick="openBowlEditor()">🥣</button>
  <button id="skinBtn" onclick="openSkin()">🎨</button>
  <button id="editorBtn" onclick="openEditor()">⚙️</button>
</div>

<div id="achievements" class="panel">
  <h2>🏆 Достижения</h2>
  <div id="achProgress"></div>
  <div id="achList"></div>
  <div style="height:60px"></div>
</div>
<div id="achToolbar" class="toolbar" style="display:none">
  <button class="btn-yellow" onclick="resetAch()">↺ Сброс</button>
  <button class="btn-gray" onclick="closeAch()">✖ Закрыть</button>
</div>

<div id="editor" class="panel">
  <h2>🛠️ Редактор уровней</h2>
  <div class="mini">Конфиг — <code>catConfig</code>, прогресс — <code>catProgress</code>.</div>
  <div id="edList"></div>
  <div style="height:60px"></div>
</div>
<div id="edToolbar" class="toolbar" style="display:none">
  <button class="btn-green" onclick="edAddLevel()">➕ Уровень</button>
  <button class="btn-blue" onclick="edSave()">💾 Применить</button>
  <button class="btn-yellow" onclick="edExport()">📤 Экспорт</button>
  <button class="btn-yellow" onclick="edImport()">📥 Импорт</button>
  <button class="btn-teal" onclick="edShareLevel()">🌐 Поделиться</button>
  <button class="btn-red" onclick="edResetProgress()">🧹 Сброс</button>
  <button class="btn-gray" onclick="closeEditor()">✖ Закрыть</button>
</div>

<div id="skin" class="panel">
  <h2>🎨 Свой котик</h2>
  <div id="skinPreview"></div>
  <div class="skinrow"><label>Шерсть</label><input type="color" id="sk_body" oninput="skinChange()"></div>
  <div class="skinrow"><label>Ушки</label><input type="color" id="sk_ear" oninput="skinChange()"></div>
  <div class="skinrow"><label>Глаза</label><input type="color" id="sk_eye" oninput="skinChange()"></div>
  <div class="skinrow"><label>Нос</label><input type="color" id="sk_nose" oninput="skinChange()"></div>
  <div class="skinrow"><label>Полоски</label><input type="checkbox" id="sk_stripes" onchange="skinChange()" style="width:22px;height:22px"></div>
  <div class="skinrow"><label>Хвост</label><input type="checkbox" id="sk_tail" onchange="skinChange()" style="width:22px;height:22px"></div>
  <div class="skinrow"><label>Пятнышки</label><input type="checkbox" id="sk_spot" onchange="skinChange()" style="width:22px;height:22px"></div>
  <div class="skinrow"><label>Размер</label><input type="range" min="50" max="100" id="sk_size" oninput="skinChange()"><span class="skinval" id="v_size"></span></div>
  <label id="skinUpload">📷 Или загрузи картинку котика (PNG)<input type="file" accept="image/*" id="skinFile" style="display:none"></label>
  <div style="height:60px"></div>
</div>
<div id="skinToolbar" class="toolbar" style="display:none">
  <button class="btn-green" onclick="skinSave()">💾 Сохранить</button>
  <button class="btn-yellow" onclick="skinReset()">↺ Сброс</button>
  <button class="btn-gray" onclick="closeSkin()">✖ Закрыть</button>
</div>
<div id="bowlEditor" class="panel">
  <h2>🥣 Редактор миски</h2>
  <div id="bowlPreview">🥣</div>
  <div class="mini" style="text-align:center">Выбери иконку:</div>
  <div class="bowlSelect" id="bowlSelect"></div>
  <div class="skinrow"><label>Размер,px</label><input type="range" min="40" max="120" id="bw_size" oninput="bowlChange()"><span class="skinval" id="v_bwsize"></span></div>
  <div class="skinrow"><label>Свечение</label><input type="color" id="bw_glow" oninput="bowlChange()"></div>
  <div class="skinrow"><label>Звук</label>
    <select id="bw_sound" onchange="bowlChange()" style="flex:1;background:#0f0f1e;border:1px solid #333;color:#fff;padding:8px;border-radius:8px">
      <option value="meow">Мяу</option>
      <option value="nom">Ням-ням</option>
      <option value="garmoshka">🪗 Гармошка</option>
      <option value="none">Без звука</option>
    </select>
  </div>
  <div class="skinrow"><label>Реплика победы</label><input id="bw_victory" oninput="bowlChange()" style="flex:1;background:#0f0f1e;border:1px solid #333;color:#fff;padding:8px;border-radius:8px"></div>
  <div style="height:60px"></div>
</div>
<div id="bowlToolbar" class="toolbar" style="display:none">
  <button class="btn-green" onclick="bowlSave()">💾 Сохранить</button>
  <button class="btn-yellow" onclick="bowlReset()">↺ Сброс</button>
  <button class="btn-gray" onclick="closeBowlEditor()">✖ Закрыть</button>
</div>

<div id="community" class="panel">
  <h2>🌐 Сообщество уровней</h2>
  <div class="mini">Введи код уровня из редактора → «Поделиться».</div>
  <input id="commInput" placeholder="Вставь код cat1:... или секретный код" oninput="commPreview()">
  <div class="edbtns">
    <button class="btn-teal" onclick="commLoad()">🔍 Загрузить</button>
    <button class="btn-gray" onclick="commClear()">✖ Очистить</button>
  </div>
  <div id="commPreview">Здесь появится предпросмотр.</div>
  <h3 style="margin-top:20px;font-size:15px;color:#ffd166">📚 Загруженные уровни</h3>
  <div class="commList" id="commList"></div>
  <div style="height:60px"></div>
</div>
<div id="commToolbar" class="toolbar" style="display:none">
  <button class="btn-gray" onclick="closeCommunity()">✖ Закрыть</button>
</div>

<script>
// ============================================================
//  ДОСТИЖЕНИЯ
// ============================================================
const ACH_DEFS = [
  {id:'first_morning', ic:'🌅', name:'Ранняя пташка', desc:'Открой первые утренние врата'},
  {id:'first_evening', ic:'🌆', name:'Вечерний гость', desc:'Открой первые вечерние врата'},
  {id:'first_level',   ic:'🥇', name:'Первый шаг', desc:'Пройди свой первый уровень полностью'},
  {id:'bowl_eat',      ic:'🍖', name:'Ням-ням', desc:'Покорми котика из миски'},
  {id:'cat_custom',    ic:'🎨', name:'Модный котик', desc:'Настрой своего котика'},
  {id:'editor_use',    ic:'🛠️', name:'Мастер уровней', desc:'Сохрани изменения в редакторе уровней'},
  {id:'night_owl',     ic:'🌙', name:'Полуночник', desc:'Зайди в игру после 00:00 до 04:00'},
  {id:'early_bird',    ic:'🐦', name:'Ранний червячок', desc:'Зайди в игру в 05:00–07:00'},
  {id:'days_3',        ic:'📅', name:'День за днём', desc:'Играй 3 разных дня подряд'},
  {id:'delta_meow',    ic:'🐱', name:'Дельтамяу', desc:'Услышь реплику про дельтамяу'},
  {id:'easter_egg',    ic:'🕵️', name:'Искатель тайн', desc:'Ты нашёл то, что скрыто от других', secret:true},
  {id:'share_level',   ic:'📤', name:'Поделился', desc:'Скопируй код уровня для друга'},
  {id:'import_level',  ic:'📥', name:'Импортёр', desc:'Загрузи уровень другого игрока'},
  {id:'all_levels',    ic:'🏆', name:'Покоритель', desc:'Пройди все уровни в конфиге'},
  {id:'collector',     ic:'🌟', name:'Коллекционер', desc:'Открой 10 достижений'}
];
// ============================================================
//  КОНФИГ
// ============================================================
const DEFAULT_CONFIG = {
  levels: [
    { name:'Лесная тропа',
      morning:{ day:1, icon:'🌲', pos:[25,28], label:'Утро дня 1 — опушка' },
      evening:{ day:1, icon:'🌳', pos:[75,28], label:'Вечер дня 1 — чаща' },
      bowl:{ pos:[50,55], icon:'🥣' } },
    { name:'Река времени',
      morning:{ day:1, icon:'🌊', pos:[25,58], label:'Утро дня 1 — брод' },
      evening:{ day:2, icon:'⛵', pos:[75,58], label:'Вечер дня 2 — лодка' },
      bowl:{ pos:[50,75], icon:'🥣' } }
  ]
};
const DEFAULT_SKIN = { body:'#f2a65a', ear:'#e08040', eye:'#2ecc71', nose:'#e74c3c', stripes:false, tail:true, spot:false, size:70, image:null };
const DEFAULT_BOWL_CFG = { icon:'🥣', size:56, glow:'#ffb84d', sound:'meow', victory:'Мяу вкусняшка', special:false };
const LINES = {
  wall:'Мяу тут стена', victory:'Мяу вкусняшка', delta:'Я уже скачал дельтамяу',
  garmoshka:'Мяу! Миска-гармошка! 🪗', garmoshkaEat:'Мяу-у-у! Гармошечная вкусняшка! 🎵'
};
const EASTER_EGG_CODE = 'limni_official';

// ============================================================
//  ХРАНИЛИЩА
// ============================================================
function loadJSON(k, def){ try{const r=localStorage.getItem(k); if(r) return JSON.parse(r);}catch(e){} return JSON.parse(JSON.stringify(def)); }
let CONFIG   = loadJSON('catConfig', DEFAULT_CONFIG);
let PROGRESS = loadJSON('catProgress', { levels: [] });
let SKIN     = loadJSON('catSkin', DEFAULT_SKIN);
let BOWL_CFG = loadJSON('catBowlCfg', DEFAULT_BOWL_CFG);
let LOADED   = loadJSON('catLoadedLevels', []);
let EASTER   = loadJSON('catEaster', { garmoshka:false });
let ACH      = loadJSON('catAchievements', { unlocked: {}, seen:{} });
let DAYS     = loadJSON('catDaysPlayed', { days: [] });

function saveConfig(c){ localStorage.setItem('catConfig', JSON.stringify(c)); }
function saveProgress(p){ localStorage.setItem('catProgress', JSON.stringify(p)); }
function saveSkin(s){ localStorage.setItem('catSkin', JSON.stringify(s)); }
function saveBowlCfg(c){ localStorage.setItem('catBowlCfg', JSON.stringify(c)); }
function saveLoaded(l){ localStorage.setItem('catLoadedLevels', JSON.stringify(l)); }
function saveEaster(e){ localStorage.setItem('catEaster', JSON.stringify(e)); }
function saveAch(a){ localStorage.setItem('catAchievements', JSON.stringify(a)); }
function saveDays(d){ localStorage.setItem('catDaysPlayed', JSON.stringify(d)); }

function reconcileProgress(){
  const n = CONFIG.levels.length;
  while(PROGRESS.levels.length < n) PROGRESS.levels.push({ startedAt:null, morning:false, evening:false, bowl:false });
  if(PROGRESS.levels.length > n) PROGRESS.levels.length = n;
  PROGRESS.levels.forEach(p=>{ if(p.bowl===undefined) p.bowl=false; });
  saveProgress(PROGRESS);
}
reconcileProgress();

function getHour(){ return new Date().getHours(); }
function isMorning(){ return getHour() < 12; }
function daysSince(ts){
  if(ts==null) return 0;
  const a=new Date(ts), b=new Date();
  const da=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const db=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.floor((db-da)/86400000);
}
function phaseLabel(){ return isMorning() ? '🌅 Утро (00:00–11:59)' : '🌆 Вечер (12:00–23:59)'; }
function timeToSwitch(){
  const now=new Date(), t=new Date(now);
  if(now.getHours()<12) t.setHours(12,0,0,0); else { t.setDate(t.getDate()+1); t.setHours(0,0,0,0); }
  const d=Math.max(0,t-now);
  return `до смены: ${Math.floor(d/3600000)}ч ${Math.floor((d%3600000)/60000)}м`;
}
function currentDayOfLevel(li){ const st=PROGRESS.levels[li].startedAt; return st==null?1:daysSince(st)+1; }

// ============================================================
//  ДОСТИЖЕНИЯ
// ============================================================
function unlockedCount(){ return Object.keys(ACH.unlocked).length; }
function unlockAch(id){
  if(ACH.unlocked[id]) return;
  const def = ACH_DEFS.find(a=>a.id===id);
  if(!def) return;
  ACH.unlocked[id] = Date.now();
  saveAch(ACH);
  updateAchBadge();
  showToast(id);
  if(id !== 'collector' && unlockedCount() >= 10) unlockAch('collector');
}
function showToast(id){
  const def = ACH_DEFS.find(a=>a.id===id); if(!def) return;
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="ic">${def.ic}</span>Достижение!<br>${def.name}`;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function updateAchBadge(){
  const b = document.getElementById('achBadge');
  const n = unlockedCount();
  if(n>0){ b.textContent=n; b.style.display='block'; }
  else b.style.display='none';
}
function resetAch(){
  if(!confirm('Сбросить все достижения?')) return;
  ACH = { unlocked:{}, seen:{} };
  saveAch(ACH);
  updateAchBadge();
  renderAch();
}
function openAch(){
  renderAch();
  document.getElementById('achievements').style.display='block';
  document.getElementById('achToolbar').style.display='flex';
  hideAllButtons();
}
function closeAch(){
  document.getElementById('achievements').style.display='none';
  document.getElementById('achToolbar').style.display='none';
  showAllButtons();
}
function renderAch(){
  const total = ACH_DEFS.length;
  const got = unlockedCount();
  document.getElementById('achProgress').innerHTML =
    `<b>${got}/${total}</b> открыто <span class="mini">— ${Math.round(got*100/total)}%</span>`;
  const wrap = document.getElementById('achList');
  wrap.innerHTML='';
  ACH_DEFS.forEach(a=>{
    const un = !!ACH.unlocked[a.id];
    const isSecret = !!a.secret && !un;
    const el = document.createElement('div');
    el.className = 'ach' + (un?' unlocked':'');
    const icon = isSecret ? '❓' : (un ? a.ic : '🔒');
    const name = isSecret ? '???' : a.name;
    const desc = isSecret ? 'Секретное достижение' : a.desc;
    el.innerHTML = `
      <div class="ic">${icon}</div>
      <div class="info">
        <h4>${name}${isSecret?' <span class="mini" style="color:#f1c40f">🔐</span>':''}</h4>
        <p>${desc}</p>
        ${un?`<div class="done">✅ Открыто ${new Date(ACH.unlocked[a.id]).toLocaleDateString()}</div>`:''}
      </div>
    `;
    wrap.appendChild(el);
  });
 }
